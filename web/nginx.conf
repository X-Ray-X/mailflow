server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API access: the browser never calls another host and the Go
    # service keeps its loopback-only binding and its own logging.
    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }
}
