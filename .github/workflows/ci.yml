name: CI — mail infrastructure

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mail-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate 1 — compose project renders cleanly and matches the declaration in the
  # repository. Nothing here touches the stack.
  compose-contract:
    runs-on: [self-hosted, radxa]
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: compose renders, pins the release, ports match the docs
        run: |
          cd deploy/mail
          # .env.example is names and examples only — a safe source for the
          # structural gates. Do not write a .env here: the runner may share a
          # checkout with the operator's real one.
          env_file=.env.example

          # the project must render and contain only the mail service
          services="$(docker compose --env-file "$env_file" config --services)"
          test "$services" = "stalwart" \
            || { echo "compose must contain only the stalwart service, found: $services"; exit 1; }

          # the declared image must be the pinned release, not a moving tag
          declared="$(grep -E '^[[:space:]]*STALWART_IMAGE=' "$env_file" | cut -d= -f2-)"
          resolved="$(docker compose --env-file "$env_file" config --images)"
          test "$resolved" = "$declared" \
            || { echo "compose resolves image '$resolved', expected '$declared'"; exit 1; }

          # declared ports must match the documented inventory (no port 25,
          # admin/JMAP listeners on loopback only). Parsed from the rendered
          # config, so this asserts the PR's declaration without touching a
          # running stack. Keep the Python on one line: this whole block is an
          # indented YAML scalar, and a multi-line -c script would inherit the
          # indentation and fail with IndentationError.
          expected="443,465,993,8089"  # ascending, as rendered below
          actual="$(docker compose --env-file "$env_file" config --format json \
            | python3 -c 'import json,sys; cfg=json.load(sys.stdin); print(",".join(str(port) for port in sorted({int(p["published"]) for service in cfg["services"].values() for p in service.get("ports", [])})))')"
          test "$actual" = "$expected" \
            || { echo "declared ports are '$actual', expected '$expected'"; exit 1; }

      - name: compose config
        run: docker compose -f deploy/mail/compose.yaml --env-file deploy/mail/.env.example config

      # Gate 2 — the application is its own project. It must render with one
      # service, publish on loopback only, and share nothing with the mail
      # deployment except a copy of the CA. The CA is a named volume, not a bind
      # mount: the deploy streams it through the Docker daemon, because the
      # runner's checkout is not a path the host daemon can resolve. This job
      # name predates the application unit; both gates live here so one required
      # check covers every Compose project in the repository.
      - name: application compose is a separate project
        run: |
          cd deploy/app
          env_file=.env.example

          services="$(docker compose --env-file "$env_file" config --services)"
          test "$services" = "api" \
            || { echo "application compose must contain only the api service, found: $services"; exit 1; }

          # one service, loopback-only ports, no bind mounts, and the CA in the
          # app-owned volume the deploy refills. The mail data directory must
          # never appear.
          docker compose --env-file "$env_file" config --format json \
            | python3 -c '
          import json, sys

          c = json.load(sys.stdin)
          services = c["services"]
          assert list(services) == ["api"], list(services)
          api = services["api"]

          ports = api.get("ports") or []
          assert ports and all(p.get("host_ip") == "127.0.0.1" for p in ports), ports

          mounts = api.get("volumes") or []
          binds = [m for m in mounts if m.get("type") == "bind"]
          assert not binds, binds
          ca = [m for m in mounts if m.get("type") == "volume"]
          assert len(ca) == 1, mounts
          mount = ca[0]
          assert mount.get("source") == "ca", mount
          assert mount.get("target") == "/etc/mailflow", mount
          assert mount.get("read_only") is True, mount

          net = c["networks"]["mail"]
          assert net.get("external") is True, net
          assert net.get("name") == "mailflow-mail_default", net

          volume = c["volumes"]["ca"]
          assert volume.get("external") is True, volume
          assert volume.get("name") == "mailflow-app-ca", volume

          print("application compose is separate and loopback-only")
          '

          if docker compose --env-file "$env_file" config | grep -q "deploy/mail"; then
            echo "application compose references the mail deployment directory" >&2
            exit 1
          fi
