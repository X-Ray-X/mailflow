name: Deploy application

# The application deployment unit. It never references the mail project's
# containers, volumes, or configuration: an application deploy cannot recreate,
# upgrade, or reset the mail infrastructure. See
# openspec/changes/archive/2026-11-16-mailflow-service-read-api/design.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_COMPOSE_DIR: deploy/app
  MAIL_CONTAINER: mailflow-stalwart
  APP_CONTAINER: mailflow-api
  APP_DB_CONTAINER: mailflow-db
  # Published loopback port. A host property, supplied by the "production"
  # environment like MAIL_DATA_DIR, because the checkout is cleaned on every run
  # and cannot carry it. Empty means the tracked default, 8080.
  MAILFLOW_API_PORT: ${{ vars.MAILFLOW_API_PORT }}
  # The application database password, supplied by the "production" environment
  # and written into the generated .env. Never committed, never printed.
  MAILFLOW_DB_PASSWORD: ${{ secrets.MAILFLOW_DB_PASSWORD }}

jobs:
  deploy:
    runs-on: [self-hosted, radxa]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: checkout mailflow
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: require the mail stack
        run: |
          set -euo pipefail
          # The application is a client of the mail infrastructure. Failing here
          # is clearer than starting a service that cannot reach anything.
          docker inspect "$MAIL_CONTAINER" >/dev/null 2>&1 \
            || { echo "error: $MAIL_CONTAINER is not running; deploy the mail infrastructure first" >&2; exit 1; }

      - name: build the image for this commit
        run: |
          set -euo pipefail
          # Built on the host and tagged by commit. The runner drives the host's
          # Docker daemon, so this image is the one the application runs, and an
          # older commit's tag remains available for rollback.
          image="mailflow-api:${GITHUB_SHA::12}"
          docker build --platform linux/arm64 -t "$image" app/
          echo "MAILFLOW_IMAGE=$image" >> "$GITHUB_ENV"

      - name: prepare the deploy environment
        run: |
          set -euo pipefail
          cd "$APP_COMPOSE_DIR"
          # .env is generated, not committed: the checkout is cleaned on every
          # run, so a file left there would not survive. The image tag comes from
          # the build and the published port from the "production" environment;
          # everything else keeps its tracked default.
          cp .env.example .env
          port="${MAILFLOW_API_PORT:-8080}"
          case "$port" in
            ''|*[!0-9]*)
              echo "error: MAILFLOW_API_PORT must be a number, got '$port'" >&2
              exit 1
              ;;
          esac
          if [ "$port" -lt 1 ] || [ "$port" -gt 65535 ]; then
            echo "error: MAILFLOW_API_PORT must be 1-65535, got '$port'" >&2
            exit 1
          fi

          # The database password is a secret from the "production" environment.
          # Validate it before it reaches the file, and escape the three
          # characters sed would otherwise interpret. A newline cannot be
          # written to a single line, so it is refused rather than truncated.
          db_password="${MAILFLOW_DB_PASSWORD:-}"
          case "$db_password" in
            '')
              echo "error: MAILFLOW_DB_PASSWORD must be set in the production environment" >&2
              exit 1
              ;;
            *$'\n'*|*$'\r'*)
              echo "error: MAILFLOW_DB_PASSWORD must be a single line" >&2
              exit 1
              ;;
          esac
          grep -q '^MAILFLOW_DB_PASSWORD=' .env \
            || { echo "error: .env.example has no MAILFLOW_DB_PASSWORD line" >&2; exit 1; }
          escaped="$(printf '%s' "$db_password" | sed 's/[&|\\]/\\&/g')"
          sed -i "s|^MAILFLOW_API_IMAGE=.*|MAILFLOW_API_IMAGE=${MAILFLOW_IMAGE}|" .env
          sed -i "s|^MAILFLOW_API_PORT=.*|MAILFLOW_API_PORT=${port}|" .env
          sed -i "s|^MAILFLOW_DB_PASSWORD=.*|MAILFLOW_DB_PASSWORD=${escaped}|" .env
          chmod 600 .env

      - name: check the published port is free
        run: |
          set -euo pipefail
          cd "$APP_COMPOSE_DIR"
          port="$(sed -n 's/^MAILFLOW_API_PORT=//p' .env)"
          port="${port:-8080}"
          # Docker publishes the port before the service starts, so a collision
          # would otherwise surface as a failed start after a container was
          # created. Name the variable the operator has to change. Match every
          # host binding Docker reports, not just the loopback one.
          #
          # The application's own container may already hold the port from the
          # previous deploy. This run replaces it, so it is not a conflict:
          # exclude anything from the app Compose project or named as the app
          # container before looking for a collision.
          others="$(docker ps --format '{{.Label "com.docker.compose.project"}}|{{.Names}}|{{.Ports}}' \
            | awk -F'|' -v project="mailflow-app" -v app="$APP_CONTAINER" \
                '$1 == project || $2 == app { next } { print }')"
          if printf '%s\n' "$others" \
            | grep -Eq "(^|[ ,|])(127\.0\.0\.1|0\.0\.0\.0|\[::\]):${port}->"; then
            echo "error: 127.0.0.1:${port} is already published by another container" >&2
            echo "set MAILFLOW_API_PORT in the production environment to a free loopback port" >&2
            printf '%s\n' "$others" \
              | grep -E "(^|[ ,|])(127\.0\.0\.1|0\.0\.0\.0|\[::\]):${port}->" >&2 || true
            exit 1
          fi

      - name: copy the mail CA into the application
        run: |
          set -euo pipefail
          # A copy, not a mount of the mail data directory: the two deployment
          # units share traffic, not files. The runner is a container, so a file
          # it writes is not necessarily at the path the host daemon resolves;
          # stream the CA through the daemon into an app-owned volume instead.
          # Refilled on every deploy so a CA rotation cannot leave a stale copy.
          docker volume create mailflow-app-ca >/dev/null
          docker cp "$MAIL_CONTAINER:/etc/stalwart/tls/ca.pem" - \
            | docker run --rm --user 0 -i -v mailflow-app-ca:/certs \
                --entrypoint sh "$MAILFLOW_IMAGE" \
                -c 'tar -xf - -C /certs && chmod 644 /certs/ca.pem'

      - name: record mail state before deploying
        run: |
          set -euo pipefail
          docker inspect "$MAIL_CONTAINER" --format '{{.Id}} {{.State.StartedAt}} {{.Image}}' \
            | tee "$RUNNER_TEMP/mail-before.txt"

      - name: deploy the application
        run: |
          set -euo pipefail
          cd "$APP_COMPOSE_DIR"
          docker compose -f compose.yaml up -d --remove-orphans

      - name: wait for health
        run: |
          set -euo pipefail
          # The runner is a container, so its loopback is not the host's. Ask
          # Docker for the container's own health state instead of curling.
          # The database must be healthy before the application can be: the
          # service refuses to start without it.
          for _ in $(seq 1 45); do
            db_status="$(docker inspect "$APP_DB_CONTAINER" --format '{{.State.Health.Status}}' 2>/dev/null || echo missing)"
            api_status="$(docker inspect "$APP_CONTAINER" --format '{{.State.Health.Status}}' 2>/dev/null || echo missing)"
            if [ "$db_status" = "healthy" ] && [ "$api_status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "error: application stack did not become healthy (db=$db_status api=$api_status)" >&2
          docker logs --tail 50 "$APP_DB_CONTAINER" >&2 || true
          docker logs --tail 50 "$APP_CONTAINER" >&2 || true
          exit 1

      - name: verify the mail infrastructure was not modified
        run: |
          set -euo pipefail
          before="$(cat "$RUNNER_TEMP/mail-before.txt")"
          after="$(docker inspect "$MAIL_CONTAINER" --format '{{.Id}} {{.State.StartedAt}} {{.Image}}')"
          test "$after" = "$before" \
            || { echo "error: the mail container changed during an application deploy" >&2
                 echo "before: $before" >&2
                 echo "after:  $after" >&2
                 exit 1; }
          docker compose -p mailflow-mail ps --format '{{.Name}} {{.Status}}'

      - name: write run summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          Application deployed from ${{ github.sha }}
          Image: ${MAILFLOW_IMAGE} (built on the host, arm64)
          Health: db healthy, api healthy
          API: 127.0.0.1:${MAILFLOW_API_PORT:-8080} (host loopback)
          Database: mailflow-app-db volume preserved (not published)
          Mail: unchanged — $(cat "$RUNNER_TEMP/mail-before.txt")
          EOF
