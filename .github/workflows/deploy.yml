name: Deploy mail infrastructure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mail-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  MAIL_COMPOSE_DIR: deploy/mail
  # Absolute host path for the mail data. Required: set it in the "production"
  # environment. The runner must have this path mounted from the host at the
  # same absolute path, because Compose bind mounts are resolved by the host
  # Docker daemon, not by the runner. No default: a tracked default would bake
  # one host's layout into the repository.
  MAIL_DATA_DIR: ${{ vars.MAIL_DATA_DIR }}
  # Optional host address for the run summary only. Set it as a "production"
  # environment variable; leave it unset and the summary omits it. Not a
  # secret: it is printed in the summary, and secrets would be masked.
  MAIL_TAILNET_IP: ${{ vars.MAIL_TAILNET_IP }}

jobs:
  deploy:
    # Deploy the mail infrastructure (Stalwart + bootstrap) to the homelab host.
    # The self-hosted runner is registered on the host and drives the host's
    # docker socket, so `docker compose up -d` lands on the homelab host host.
    runs-on: [self-hosted, radxa]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: checkout mailflow
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: prepare deploy environment from the production environment
        run: |
          set -euo pipefail
          cd ${{ env.MAIL_COMPOSE_DIR }}
          # .env.example is names and examples only. Credentials come from the
          # "production" environment secrets; the host data path comes from the
          # "production" environment variables. Everything else keeps its
          # tracked default.
          cp .env.example .env
          sed -i "s|^MAIL_BOOTSTRAP_PASSWORD=.*|MAIL_BOOTSTRAP_PASSWORD=${{ secrets.MAIL_BOOTSTRAP_PASSWORD }}|" .env
          sed -i "s|^MAIL_ACCOUNT_ALICE_PASSWORD=.*|MAIL_ACCOUNT_ALICE_PASSWORD=${{ secrets.MAIL_ACCOUNT_ALICE_PASSWORD }}|" .env
          sed -i "s|^MAIL_ACCOUNT_BOB_PASSWORD=.*|MAIL_ACCOUNT_BOB_PASSWORD=${{ secrets.MAIL_ACCOUNT_BOB_PASSWORD }}|" .env
          # The data path is a host path supplied by the "production"
          # environment. Compose bind mounts are resolved by the host Docker
          # daemon, so the path must be mounted into the runner at the same
          # absolute path. Fail before touching anything if it is missing,
          # relative, or only present on the runner's own filesystem.
          : "${MAIL_DATA_DIR:?MAIL_DATA_DIR must be set in the production environment}"
          case "$MAIL_DATA_DIR" in
            /*) ;;
            *) echo "error: MAIL_DATA_DIR must be absolute, got '$MAIL_DATA_DIR'"; exit 1 ;;
          esac
          data_parent="$(dirname "$MAIL_DATA_DIR")"
          test -d "$data_parent" \
            || { echo "error: $data_parent does not exist in the runner; mount the host path"; exit 1; }
          mount_point="$(stat -c %m "$data_parent")"
          case "$mount_point" in
            /|"$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*)
              echo "error: MAIL_DATA_DIR is not on a host mount (mount point: $mount_point)"; exit 1 ;;
          esac
          case "$GITHUB_WORKSPACE/" in
            "$mount_point"/*)
              echo "error: MAIL_DATA_DIR is on the runner workspace's mount (mount point: $mount_point)"; exit 1 ;;
          esac

          sed -i "s|^MAIL_DATA_DIR=.*|MAIL_DATA_DIR=${MAIL_DATA_DIR}|" .env
          chmod 600 .env

      - name: ensure the persistent data directory exists
        run: |
          set -euo pipefail
          # The runner is not root. Passwordless sudo prepares the directory
          # for the container's uid 2000; bootstrap re-applies ownership.
          sudo mkdir -p "$MAIL_DATA_DIR"
          sudo chown 2000:2000 "$MAIL_DATA_DIR"

      - name: bootstrap the mail server (first start only)
        run: |
          cd ${{ env.MAIL_COMPOSE_DIR }}
          # Root is needed to prepare uid-2000-owned bind mounts on the host
          # directory. The script chowns etc/lib/tls itself when running as root.
          sudo ./scripts/bootstrap.sh

      - name: start the mail service
        run: |
          cd ${{ env.MAIL_COMPOSE_DIR }}
          docker compose -f compose.yaml up -d --remove-orphans

      - name: wait for the HTTPS listener
        run: |
          cd ${{ env.MAIL_COMPOSE_DIR }}
          # The runner is a container, so its 127.0.0.1 is not the host's.
          # Exec into the service and use its internal listener instead.
          for i in $(seq 1 30); do
            if docker exec mailflow-stalwart curl -sk https://127.0.0.1:443/healthz/live >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "HTTPS listener did not become healthy" >&2
          exit 1

      - name: verify published ports and tailnet certificate
        run: |
          cd ${{ env.MAIL_COMPOSE_DIR }}
          # published ports must match the documented inventory (no port 25;
          # admin/JMAP listeners stay on loopback only). Read from the rendered
          # config so the check is stable across compose versions; the `up -d`
          # above already made the running stack match it. Keep the Python on
          # one line: the heredoc-free block is an indented YAML scalar, and a
          # multi-line -c script would inherit the indentation.
          expected="443,465,993,8089"  # ascending, as rendered below
          actual="$(docker compose -f compose.yaml config --format json \
            | python3 -c 'import json,sys; cfg=json.load(sys.stdin); print(",".join(str(port) for port in sorted({int(p["published"]) for service in cfg["services"].values() for p in service.get("ports", [])})))')"
          test "$actual" = "$expected" \
            || { echo "published ports are '$actual', expected '$expected'"; exit 1; }

          # certificate must cover the canonical tailnet hostname. Read it from
          # inside the service (the runner's loopback is not the host's) with
          # SNI, so the check does not depend on host DNS; the SAN is what
          # matters. The internal CA trust store lives on the clients; full
          # validation is scripts/verify.sh.
          docker exec mailflow-stalwart openssl s_client \
            -connect 127.0.0.1:993 -servername mail.mailflow.test \
            </dev/null | openssl x509 -noout -ext subjectAltName \
            | grep -q "DNS:mail.mailflow.test" \
            || { echo "certificate does not cover mail.mailflow.test"; exit 1; }

      - name: write run summary
        run: |
          if [ -n "${MAIL_TAILNET_IP:-}" ]; then
            tailnet="mail.mailflow.test (tailnet IP ${MAIL_TAILNET_IP})"
          else
            tailnet="mail.mailflow.test"
          fi
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          Mailflow deployed from ${{ github.sha }}
          Tailnet: ${tailnet}
          Services: IMAPS 993 · SMTP 465 · HTTPS/JMAP 443 (loopback) · setup 8089 (loopback)
          EOF
