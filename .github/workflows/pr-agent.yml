name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created, edited]

jobs:
  pr_agent_job:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: PR Agent action step
        id: pragent
        uses: The-PR-Agent/pr-agent@main
        env:
          # Free-tier Google AI Studio Gemini key (no paid subscription).
          # The GitHub Environment secret GEMINI_API_KEY is injected via this
          # env var name (dot in name is valid for GitHub Actions env keys).
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR-Agent documented config keys, mirrored as environment variables.
          # The dot-keys are valid as Linux runner env var names and map onto
          # the model / behaviour settings.
          #
          # The provider prefix is required: LiteLLM treats a bare
          # "gemini-3-flash-preview" as Vertex AI and then fails with
          # DefaultCredentialsError. "gemini/" routes it to Google AI Studio,
          # which is what GOOGLE_AI_STUDIO.GEMINI_API_KEY authenticates.
          config.model: "gemini/gemini-3-flash-preview"
          config.fallback_models: '[]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
