name: mailflow-app

# The application deployment unit. It is a Compose project of its own so that
# deploying, restarting, or rolling it back can never recreate, upgrade, or
# reset the mail infrastructure. See
# openspec/changes/archive/2026-11-16-mailflow-service-read-api/design.md.
#
# It joins the mail project's network because a container cannot reach the
# host's loopback, where the mail HTTPS listener is published. It shares no
# container, volume, or configuration file with the mail project.

services:
  api:
    image: ${MAILFLOW_API_IMAGE:?MAILFLOW_API_IMAGE must be set}
    container_name: mailflow-api
    init: true
    restart: unless-stopped

    environment:
      # Inside the network the mail container is the address; the certificate
      # is still issued for the mail hostname, so both are configured.
      MAILFLOW_JMAP_URL: ${MAILFLOW_JMAP_URL:-https://mailflow-stalwart/jmap/}
      MAILFLOW_JMAP_HOSTNAME: ${MAILFLOW_JMAP_HOSTNAME:-mail.mailflow.test}
      MAILFLOW_CA_FILE: /etc/mailflow/ca.pem
      # Docker publishes to the container's address, not its loopback.
      MAILFLOW_LISTEN_ADDR: 0.0.0.0:8080
      MAILFLOW_REQUEST_TIMEOUT: ${MAILFLOW_REQUEST_TIMEOUT:-10s}
      MAILFLOW_PAGE_SIZE_DEFAULT: ${MAILFLOW_PAGE_SIZE_DEFAULT:-25}
      MAILFLOW_PAGE_SIZE_MAX: ${MAILFLOW_PAGE_SIZE_MAX:-100}
      MAILFLOW_BODY_MAX_BYTES: ${MAILFLOW_BODY_MAX_BYTES:-262144}
      # Application state: idempotency records. Resolved by Compose DNS on the
      # private data network; the password comes from the generated .env.
      MAILFLOW_DB_HOST: db
      MAILFLOW_DB_PORT: "5432"
      MAILFLOW_DB_NAME: ${MAILFLOW_DB_NAME:-mailflow}
      MAILFLOW_DB_USER: ${MAILFLOW_DB_USER:-mailflow}
      MAILFLOW_DB_PASSWORD: ${MAILFLOW_DB_PASSWORD:?MAILFLOW_DB_PASSWORD must be set}
      MAILFLOW_IDEMPOTENCY_TTL: ${MAILFLOW_IDEMPOTENCY_TTL:-24h}
      MAILFLOW_IDEMPOTENCY_LEASE: ${MAILFLOW_IDEMPOTENCY_LEASE:-2m}
      MAILFLOW_SEND_MAX_RECIPIENTS: ${MAILFLOW_SEND_MAX_RECIPIENTS:-50}
      MAILFLOW_SEND_MAX_BYTES: ${MAILFLOW_SEND_MAX_BYTES:-262144}

    ports:
      # Host loopback only. Widening this belongs to the change that adds a
      # consumer, not to this one.
      - "127.0.0.1:${MAILFLOW_API_PORT:-8080}:8080"

    volumes:
      # The mail CA, copied into an app-owned volume at deploy time and mounted
      # read-only. A host bind mount would have to exist at the same path on the
      # Docker host, which the runner's checkout does not: the daemon resolves
      # bind sources on the host, not in the runner. The mail data directory is
      # never mounted here.
      - ca:/etc/mailflow:ro

    depends_on:
      db:
        condition: service_healthy

    networks:
      - mail
      - data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    # Static client only. It joins the application's internal network to proxy
    # /v1 to the API; it has no access to the mail network or mail volumes.
    image: ${MAILFLOW_WEB_IMAGE:?MAILFLOW_WEB_IMAGE must be set}
    container_name: mailflow-web
    init: true
    restart: unless-stopped
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    ports:
      - "127.0.0.1:${MAILFLOW_WEB_PORT:-8082}:80"
    networks:
      - data
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    # Pinned by exact release; the digest is recorded in
    # docs/application-database.md. PostgreSQL owns Mailflow application state
    # only, never mailbox contents.
    image: ${MAILFLOW_DB_IMAGE:?MAILFLOW_DB_IMAGE must be set}
    container_name: mailflow-db
    init: true
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${MAILFLOW_DB_NAME:-mailflow}
      POSTGRES_USER: ${MAILFLOW_DB_USER:-mailflow}
      POSTGRES_PASSWORD: ${MAILFLOW_DB_PASSWORD:?MAILFLOW_DB_PASSWORD must be set}

    volumes:
      # The pinned image declares /var/lib/postgresql as its volume and keeps
      # PGDATA below it. Application-owned, so an application deploy can never
      # remove mailbox state and a mail deploy can never see it.
      - db:/var/lib/postgresql

    # No ports: the database is reachable only from the application's private
    # data network.

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

    networks:
      - data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # App-owned, so the copy cannot be mistaken for a mail volume. Created and
  # refilled from the mail container by the deploy before the project starts,
  # so its lifecycle is the deploy's, not Compose's.
  ca:
    name: mailflow-app-ca
    external: true
  # Application state only. Compose creates it on first start and never removes
  # it on `up --remove-orphans`; only an explicit `down --volumes` would.
  db:
    name: mailflow-app-db

networks:
  mail:
    external: true
    name: ${MAILFLOW_MAIL_NETWORK:-mailflow-mail_default}
  # Private to the application project: the database has no route off this
  # network, and nothing in the mail project joins it.
  data:
    name: mailflow-app-data
    internal: true
  # The static client needs a non-internal network for its loopback port; it
  # carries no database or mail traffic.
  frontend:
    name: mailflow-app-frontend
